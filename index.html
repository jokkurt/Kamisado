<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kamisado</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a1430'/%3E%3Crect x='6' y='6' width='20' height='20' rx='3' fill='%23e8862e'/%3E%3Crect x='10' y='12' width='12' height='12' rx='2' fill='%237a4a2b'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">

    <!-- ============ MENU ============ -->
    <section id="menu" class="screen">
      <div class="menu-inner">
        <div class="logo-wrap">
          <div class="logo-squares" id="menu-squares"></div>
          <h1 class="logo">KAMISADO</h1>
          <p class="tagline" id="tagline">The game of strategy &amp; the sumo towers</p>
        </div>

        <div class="menu-card">
          <div class="mode-row">
            <button class="mode-btn" id="btn-cpu">
              <span class="mode-ico">🤖</span>
              <span class="mode-label">CPU Opponent</span>
            </button>
            <button class="mode-btn" id="btn-2p">
              <span class="mode-ico">👥</span>
              <span class="mode-label">2 Players</span>
            </button>
          </div>

          <div id="cpu-options" class="opts" hidden>
            <div class="opt-group">
              <label>Play as</label>
              <div class="seg" id="seg-side">
                <button data-side="W" class="seg-btn active">⚪ White</button>
                <button data-side="B" class="seg-btn">⚫ Black</button>
              </div>
            </div>
            <div class="opt-group">
              <label>CPU strength</label>
              <div class="seg" id="seg-diff">
                <button data-diff="easy" class="seg-btn">Easy</button>
                <button data-diff="medium" class="seg-btn active">Medium</button>
                <button data-diff="hard" class="seg-btn">Hard</button>
              </div>
            </div>
          </div>

          <div class="opt-group">
            <label>Game length</label>
            <div class="seg" id="seg-target">
              <button data-target="1" class="seg-btn">1 pt</button>
              <button data-target="3" class="seg-btn active">3 pts</button>
              <button data-target="7" class="seg-btn">7 pts</button>
              <button data-target="15" class="seg-btn">15 pts</button>
            </div>
          </div>

          <button id="btn-start" class="start-btn">Start Game</button>

          <div class="menu-foot">
            <button class="ghost-btn" id="btn-rules">📖 Rules</button>
            <button class="ghost-btn" id="btn-sound">🔊 Sound: On</button>
          </div>
        </div>
        <p class="credit">Original game by Huch &amp; friends · This is a fan web implementation</p>
      </div>
    </section>

    <!-- ============ GAME ============ -->
    <section id="game" class="screen" hidden>
      <div class="game-layout">
        <!-- top player bar -->
        <div class="player-bar top" id="bar-top"></div>

        <div class="board-area">
          <div class="board-frame">
            <div class="board-frame-side"></div>
            <div class="board-label top" id="label-top">Black</div>
            <div id="board" class="board">
              <svg id="board-svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
              <div id="fx-sel" class="fx-sel"></div>
              <div id="towers" class="towers"></div>
              <div id="fx" class="fx"></div>
            </div>
            <div class="board-label bottom" id="label-bottom">White</div>
          </div>
        </div>

        <div class="player-bar bottom" id="bar-bottom"></div>

        <!-- side panel -->
        <aside class="panel">
          <div class="panel-brand">KAMISADO</div>

          <div class="turn-box" id="turn-box">
            <div class="turn-row">
              <span class="turn-coin" id="turn-coin">⚪</span>
              <div>
                <div class="turn-title" id="turn-title">Your turn</div>
                <div class="turn-sub" id="turn-sub">Choose a tower</div>
              </div>
            </div>
            <div class="required" id="required" hidden>
              <span class="req-label" id="req-label">Required Color</span>
              <span class="req-badge" id="req-badge"></span>
              <span class="req-name" id="req-name"></span>
            </div>
          </div>

          <div class="round-box card">
            <div class="round-num" id="round-num">Round 1</div>
            <div class="target-num" id="target-num">First to 3</div>
          </div>

          <div class="lastmove-box card" id="lastmove-box" hidden>
            <div class="lm-label" id="lm-label">Last Move</div>
            <div class="lm-text" id="lm-text"></div>
          </div>

          <div class="score-box card" id="score-box">
            <div class="score-label" id="score-label">Score</div>
            <div class="score-row">
              <span class="score-side w">⚪ <b id="score-w">0</b></span>
              <span class="score-sep">:</span>
              <span class="score-side b"><b id="score-b">0</b> ⚫</span>
            </div>
          </div>

          <div class="hint" id="hint"></div>

          <div class="panel-actions">
            <button class="action-btn" id="btn-pass" hidden>⏭ Skip turn</button>
            <div class="reform" id="reform" hidden>
              <div class="reform-title">Winning side — set the line</div>
              <div class="reform-btns" id="reform-btns">
                <button class="action-btn" data-dir="L">◀ From Left</button>
                <button class="action-btn" data-dir="R">From Right ▶</button>
              </div>
            </div>
            <button class="action-btn ghost" id="btn-menu">↩ Menu</button>
          </div>
        </aside>
      </div>
    </section>

    <!-- ============ OVERLAYS ============ -->
    <div id="overlay" class="overlay" hidden>
      <div class="overlay-card" id="overlay-card"></div>
    </div>
  </div>

  <script src="js/board.js"></script>
  <script src="js/core.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
